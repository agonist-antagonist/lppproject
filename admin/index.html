<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lppproject / 台帳編集</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="editor.css"><script src="../data/catalog.js"></script></head>
<body><header><a href="../index.html">Lppproject</a><h1>台帳編集</h1><a href="diary.html">DIARY 投稿・編集</a></header>
<main>
<p class="intro">商品を選ぶか「追加」を押し、編集後に「保存して catalog.js を書き出す」を押します。書き出したファイルをサイトの <b>data/catalog.js</b> に上書きしてください。</p>
<div class="actions"><label class="import-label">台帳ファイルを読み込む<input id="import-file" type="file" accept=".js,.json,.csv"></label></div>
<p id="status" role="status" aria-live="polite"></p>
<div class="editor-layout"><aside><label>編集対象<select id="kind"><option value="market">MARKET / 商品</option><option value="process">Process / 音源</option><option value="rooms">Text / 小部屋</option><option value="loops">動画</option><option value="settings">設定</option></select></label><label>絞り込み<input id="record-search" type="search"></label><select id="records" size="12" aria-label="登録一覧"></select><div class="side-actions"><button id="add-record">追加</button><button id="duplicate-record">複製</button><button id="delete-record">削除</button></div><button id="restore-draft" hidden>ブラウザの下書きを復元</button><button id="reset-data">配布時のデータに戻す</button></aside>
<section><form id="record-form"><div id="fields"></div><div class="side-actions"><button type="button" id="export-data" class="save">保存して catalog.js を書き出す</button><button type="submit">下書き保存</button></div></form></section></div>
<details><summary>素材の追加・バックアップ</summary>
<p>画像や音源はサイトの assets/uploads/ などにコピーし、フォームに assets/uploads/ファイル名 を入力してください。公開サイトの更新には、素材と data/catalog.js のアップロードが必要です。</p>
<div class="actions"><button id="export-csv">CSV台帳を書き出す</button><button id="export-json">JSONバックアップ</button></div></details>
</main><script src="editor.js"></script></body></html>
